<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Catering Slideshow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0e08;
    font-family: Georgia, 'Times New Roman', serif;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  #slideshow {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #1a0e08;
  }

  .slide {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: end;
    -ms-flex-align: end;
    align-items: flex-end;
    opacity: 0;
    -webkit-transition: opacity 1.2s ease;
    transition: opacity 1.2s ease;
  }
  .slide.active { opacity: 1; }

  .slide-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center center;
    background-color: #1a0e08;
  }

  .slide-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: -webkit-linear-gradient(bottom, rgba(15,7,3,0.93) 0%, rgba(15,7,3,0.5) 30%, rgba(15,7,3,0.05) 60%, transparent 100%);
    background: linear-gradient(to top, rgba(15,7,3,0.93) 0%, rgba(15,7,3,0.5) 30%, rgba(15,7,3,0.05) 60%, transparent 100%);
  }

  .slide-info {
    position: relative;
    width: 100%;
    padding: 48px 72px 80px 72px;
    z-index: 2;
  }

  .slide-tag {
    display: block;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #D4832A;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: normal;
    margin-bottom: 14px;
  }

  .slide-title {
    font-size: 56px;
    color: #FDF6EC;
    line-height: 1.1;
    margin-bottom: 16px;
    text-shadow: 0 2px 24px rgba(0,0,0,0.5);
  }

  .divider {
    width: 52px;
    height: 2px;
    background: #D4832A;
    margin-bottom: 16px;
  }

  .slide-desc {
    font-size: 20px;
    color: rgba(237,217,190,0.9);
    line-height: 1.75;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: normal;
    max-width: 600px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }

  /* Progress bar */
  #progress-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 4px;
    background: #D4832A;
    width: 0%;
    z-index: 20;
  }

  /* Dots */
  #dots {
    position: absolute;
    bottom: 20px;
    left: 50%;
    margin-left: -50px;
    width: 100px;
    text-align: center;
    z-index: 10;
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    margin: 0 4px;
  }
  .dot.active { background: #D4832A; }

  /* Clock */
  #clock {
    position: absolute;
    top: 36px; left: 48px;
    color: rgba(255,255,255,0.45);
    font-size: 15px;
    letter-spacing: 3px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: normal;
    z-index: 10;
  }

  /* Setup screen shown if no images defined */
  #setup-msg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    background: #FDF6EC;
    padding: 60px;
    text-align: center;
  }
  #setup-msg h1 {
    font-size: 36px;
    color: #5C3D2E;
    margin-bottom: 24px;
  }
  #setup-msg p {
    font-size: 18px;
    color: #C4714A;
    line-height: 1.8;
    max-width: 600px;
    font-family: Arial, Helvetica, sans-serif;
  }
  #setup-msg code {
    display: block;
    background: #5C3D2E;
    color: #EDD9BE;
    padding: 20px 28px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 2;
    text-align: left;
    margin: 24px 0;
    font-family: 'Courier New', monospace;
    max-width: 640px;
  }
</style>
</head>
<body>

<div id="slideshow">
  <div id="clock"></div>
  <div id="progress-bar"></div>
  <div id="dots"></div>
</div>

<script>
// ============================================================
//  HOW TO ADD YOUR PHOTOS
//  1. Copy this HTML file and your photo files into the same
//     folder on your USB stick.
//  2. Edit the IMAGES list below — just add the filename
//     of each photo (e.g. "food1.jpg").
//  3. Optionally edit the caption for each photo, or set
//     caption to null for a photo-only slide.
// ============================================================

var IMAGES = [
  // { file: "photo1.jpg", caption: { tag: "Our Services", title: "Crafted with Love", desc: "Every dish prepared fresh, with ingredients chosen for flavor and quality." } },
  // { file: "photo2.jpg", caption: { tag: "Catering", title: "Events to Remember", desc: "From intimate gatherings to grand celebrations — we handle every detail." } },
  // { file: "photo3.jpg", caption: null },
  // { file: "photo4.jpg", caption: { tag: "Menu", title: "Flavors that Delight", desc: "A menu built around taste, tradition, and the joy of sharing a great meal." } },
  // { file: "photo5.jpg", caption: { tag: "Presentation", title: "Beautiful Presentation", desc: "We believe food should be as beautiful to look at as it is delicious to eat." } },
  // { file: "photo6.jpg", caption: null },
];

// ============================================================
//  SETTINGS
// ============================================================
var SLIDE_DURATION = 6000; // milliseconds per slide (6000 = 6 seconds)

// ============================================================
//  SLIDESHOW ENGINE — no need to edit below this line
// ============================================================
var currentIndex = 0;
var timer = null;
var barStart = null;
var barFrame = null;

function init() {
  if (IMAGES.length === 0) {
    showSetupMessage();
    return;
  }
  buildSlides();
  buildDots();
  showSlide(0);
  startClock();
}

function showSetupMessage() {
  var msg = document.createElement('div');
  msg.id = 'setup-msg';
  msg.innerHTML = '<h1>Almost ready!</h1>' +
    '<p>Open this HTML file in a text editor and add your photo filenames to the <strong>IMAGES</strong> list at the top of the script. Place your photos in the same folder as this file on the USB stick.</p>' +
    '<code>' +
    'var IMAGES = [<br>' +
    '&nbsp;&nbsp;{ file: "photo1.jpg", caption: { tag: "Catering", title: "Crafted with Love", desc: "Your description here." } },<br>' +
    '&nbsp;&nbsp;{ file: "photo2.jpg", caption: null },<br>' +
    '&nbsp;&nbsp;{ file: "photo3.jpg", caption: { tag: "Menu", title: "Flavors that Delight", desc: "Another description." } },<br>' +
    '];' +
    '</code>' +
    '<p>Save the file, put it back on the USB stick, and open it on the TV.</p>';
  document.getElementById('slideshow').appendChild(msg);
}

function buildSlides() {
  var ss = document.getElementById('slideshow');
  for (var i = 0; i < IMAGES.length; i++) {
    var item = IMAGES[i];
    var slide = document.createElement('div');
    slide.className = 'slide';

    var bg = document.createElement('div');
    bg.className = 'slide-bg';
    bg.style.backgroundImage = "url('" + item.file + "')";
    slide.appendChild(bg);

    if (item.caption) {
      var overlay = document.createElement('div');
      overlay.className = 'slide-overlay';
      slide.appendChild(overlay);

      var info = document.createElement('div');
      info.className = 'slide-info';
      info.innerHTML =
        '<span class="slide-tag">' + item.caption.tag + '</span>' +
        '<div class="slide-title">' + item.caption.title + '</div>' +
        '<div class="divider"></div>' +
        '<p class="slide-desc">' + item.caption.desc + '</p>';
      slide.appendChild(info);
    }

    ss.appendChild(slide);
  }
}

function buildDots() {
  var dots = document.getElementById('dots');
  dots.style.marginLeft = -(IMAGES.length * 16 / 2) + 'px';
  dots.style.width = (IMAGES.length * 16) + 'px';
  for (var i = 0; i < IMAGES.length; i++) {
    var dot = document.createElement('span');
    dot.className = 'dot';
    dots.appendChild(dot);
  }
}

function showSlide(index) {
  var slides = document.querySelectorAll('.slide');
  var dots = document.querySelectorAll('.dot');
  for (var i = 0; i < slides.length; i++) {
    slides[i].className = 'slide';
    dots[i].className = 'dot';
  }
  slides[index].className = 'slide active';
  dots[index].className = 'dot active';
  currentIndex = index;
  startProgressBar();
  clearTimeout(timer);
  timer = setTimeout(nextSlide, SLIDE_DURATION);
}

function nextSlide() {
  var next = (currentIndex + 1) % IMAGES.length;
  showSlide(next);
}

function startProgressBar() {
  var bar = document.getElementById('progress-bar');
  if (barFrame) cancelAnimationFrame(barFrame);
  bar.style.width = '0%';
  bar.style.transition = 'none';
  barStart = null;
  function animate(ts) {
    if (!barStart) barStart = ts;
    var pct = Math.min(100, ((ts - barStart) / SLIDE_DURATION) * 100);
    bar.style.width = pct + '%';
    if (pct < 100) barFrame = requestAnimationFrame(animate);
  }
  barFrame = requestAnimationFrame(animate);
}

function startClock() {
  function tick() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('clock').innerHTML = h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
  }
  tick();
  setInterval(tick, 1000);
}

// Click anywhere to advance
document.getElementById('slideshow').onclick = function() {
  clearTimeout(timer);
  if (barFrame) cancelAnimationFrame(barFrame);
  nextSlide();
};

init();
</script>
</body>
</html>
